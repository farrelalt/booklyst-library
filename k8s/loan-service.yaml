apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-service
  template:
    metadata:
      labels:
        app: loan-service
    spec:
      containers:
      - name: loan-service
        image: booklyst-loan:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_KEY
          value: "base64:rN8Jz5OU9Vyt0ZJopPUcr47xvZ+yLN2tHvvYLoGK0Wo="
        - name: DB_HOST
          value: "mysql"
        - name: DB_DATABASE
          value: "loan_service_db"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: "secret"
        - name: QUEUE_CONNECTION
          value: "redis"
        - name: REDIS_HOST
          value: "redis"
        - name: SESSION_DRIVER
          value: "file"
        - name: CACHE_STORE
          value: "file"
        - name: USER_SERVICE_URL
          value: "http://user-service:8000"
        - name: BOOK_SERVICE_URL
          value: "http://book-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
spec:
  selector:
    app: loan-service
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-worker
  template:
    metadata:
      labels:
        app: loan-worker
    spec:
      containers:
      - name: loan-worker
        image: booklyst-loan:latest
        imagePullPolicy: Never
        command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3"]
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_KEY
          value: "base64:rN8Jz5OU9Vyt0ZJopPUcr47xvZ+yLN2tHvvYLoGK0Wo="
        - name: DB_HOST
          value: "mysql"
        - name: DB_DATABASE
          value: "loan_service_db"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: "secret"
        - name: QUEUE_CONNECTION
          value: "redis"
        - name: REDIS_HOST
          value: "redis"
        - name: SESSION_DRIVER
          value: "file"
        - name: CACHE_STORE
          value: "file"
        - name: USER_SERVICE_URL
          value: "http://user-service:8000"
        - name: BOOK_SERVICE_URL
          value: "http://book-service:8000"
