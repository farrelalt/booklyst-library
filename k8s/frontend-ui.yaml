apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
    spec:
      containers:
      - name: frontend-ui
        image: booklyst-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_KEY
          value: "base64:dxU9s8+BU5s9N8m8fkbnhtvsWp5C67pTMWgWmMZYvqs="
        - name: SESSION_DRIVER
          value: "file"
        - name: CACHE_STORE
          value: "file"
        - name: USER_SERVICE_URL
          value: "http://user-service:8000"
        - name: BOOK_SERVICE_URL
          value: "http://book-service:8000"
        - name: LOAN_SERVICE_URL
          value: "http://loan-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-ui
spec:
  type: NodePort
  selector:
    app: frontend-ui
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
